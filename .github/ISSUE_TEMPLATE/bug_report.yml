name: Bug report
description: Report a reproducible issue without exposing private host data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include disk serial numbers, credentials, private IPs, or unredacted logs. This project is not yet production-ready.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: unraid-version
    attributes:
      label: Unraid version
      placeholder: "e.g. 7.x (exact version)"
    validations:
      required: true
  - type: input
    id: project-revision
    attributes:
      label: Project revision or commit
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Test environment
      options:
        - Unit tests / simulation only
        - Isolated Unraid test VM
        - Dedicated test hardware (not production)
        - Production system (please stop testing and explain safely)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
